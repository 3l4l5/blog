name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main

jobs:
  push-ecr:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.OIDC_ROLE_NAME_FOR_GITHUB }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push
        env:
          TAG: ${{ github.ref_name }}-${{ github.run_id }}
        run: |
          docker build -t home-web-front  .
          docker tag home-web-front:latest ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/home-lab/home-web-front:${{ env.TAG }}
          docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/home-lab/home-web-front:${{ env.TAG }}