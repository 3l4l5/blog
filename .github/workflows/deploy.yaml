name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main

jobs:
  push-ecr:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.OIDC_ROLE_NAME_FOR_GITHUB }}
          aws-region: ap-northeast-1
      - uses: jdx/mise-action@v4
      - name: build and publish contents
        env:
          AWS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.RUSTFS_ACCESS_SECRET }}

          AWS_ENDPOINT: ${{ vars.RUSTFS_ENDPOINT }}
          AWS_REGION: ${{ vars.RUSTFS_REGION }}
          S3_BLOG_IMAGE_BUCKET_NAME: ${{ vars.S3_BLOG_IMAGE_BUCKET_NAME }}
        run: mise run publish

      - name: Login to Amazon ECR
        run: aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

      - name: Build and Push
        env:
          TAG: ${{ github.ref_name }}-${{ github.run_id }}
        run: |
          docker build -t home-web-front  .
          docker tag home-web-front:latest ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/home-lab/home-web-front:${{ env.TAG }}
          docker push ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com/home-lab/home-web-front:${{ env.TAG }}